name: Capture Reawakening preview
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/capture-reawakening.yml']
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install only capture tools, without an unrelated desktop dependency chain
        run: |
          python3 -m pip install -r requirements-dev.txt
          timeout 120 sudo apt-get -o Acquire::Retries=0 -o Acquire::http::Timeout=15 install -y --no-install-recommends xvfb xdotool ffmpeg libgl1-mesa-dri
      - name: Match the actual public build packaging and use direct X11 focus
        shell: python
        run: |
          from pathlib import Path
          p=Path('scripts/capture_metroidvania_native.py');s=p.read_text()
          old="wm=subprocess.Popen(['openbox'],env=env,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL);processes.append(wm)"
          new="wm=subprocess.Popen(['openbox'],env=env,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL) if shutil.which('openbox') else None\n  if wm:processes.append(wm)"
          assert old in s;s=s.replace(old,new,1)
          old="  else:raise RuntimeError('Unexpected public archive type')"
          new="  elif dest.open('rb').read(4)==b'\\x7fELF':shutil.copyfile(dest,game/dest.name)\n  else:raise RuntimeError('Unexpected public build format')"
          assert old in s;p.write_text(s.replace(old,new,1))
      - name: Record the exact creator-supplied native Linux build
        run: python3 scripts/capture_metroidvania_native.py reawakening
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reawakening-preview
          path: qa/native-reawakening
