name: Capture public Metroidvania previews
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/capture-metroidvania-previews.yml']
permissions:
  contents: read
jobs:
  capture:
    strategy:
      fail-fast: false
      matrix:
        game: [spellsought,reawakening,mongrel-story]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install capture dependencies
        run: |
          python3 -m pip install -r requirements-dev.txt
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xvfb xdotool ffmpeg libgl1-mesa-dri ${{ matrix.game == 'spellsought' && 'wine64' || '' }}
      - name: Capture a short public-build preview without purchase or sign-in
        run: python3 scripts/capture_metroidvania_previews.py '${{ matrix.game }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: metroidvania-preview-${{ matrix.game }}
          path: qa/capture-${{ matrix.game }}
