name: Enrich survival collection
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/enrich_survival.py','data/survival-expansion.json','.github/workflows/enrich-survival.yml']
permissions:
  contents: write
concurrency:
  group: survival-sources
  cancel-in-progress: false
jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - run: python3 -m pip install -r requirements-dev.txt
      - name: Resolve only new, corrected or rate-limited candidates
        run: python3 scripts/enrich_survival.py
      - name: Complete exact alternate-store coverage using fresh prior checks
        run: python3 scripts/collect_survival_sources.py
      - name: Persist the expanded source checkpoint
        if: always()
        run: |
          git config user.name 'Games catalog bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/survival-*.json
          if ! git diff --cached --quiet; then
            git commit -m 'Complete expanded survival identities and edition-aware store coverage'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: survival-enrichment
          path: |
            data/survival-*
            scripts/*survival*
            site/survival.js
