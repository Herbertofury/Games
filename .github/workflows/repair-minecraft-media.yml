name: Repair Minecraft media route
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/repair_minecraft_media.py','.github/workflows/repair-minecraft-media.yml']
permissions:
  contents: write
  actions: write
concurrency:
  group: minecraft-media-repair
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - run: python3 -m pip install -r requirements-dev.txt
      - name: Verify exact official product identity and decode every replacement screenshot
        run: python3 scripts/repair_minecraft_media.py
      - name: Build and verify the changed source slice
        run: |
          python3 scripts/build.py > /tmp/survival-build.json
          python3 -m unittest discover -s tests -p test_survival.py
          python3 -m unittest discover -s tests -p test_search_contract.py
      - name: Checkpoint only the repaired source and exact image evidence
        run: |
          git config user.name 'Games catalog bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/survival-media.json data/minecraft-media-repair.json
          if ! git diff --cached --quiet; then
            git commit -m 'Restore Minecraft media through verified full-resolution Microsoft gallery assets'
            git restore data/catalog.json dist wiki docs
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Resume the unchanged complete publication gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish.yml --ref main
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: minecraft-official-media-repair
          path: data/minecraft-media-repair.json
