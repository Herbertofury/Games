name: Refresh shooter discoveries
on:
  workflow_dispatch:
  push:
    paths: ['data/shooters-seeds.json','scripts/collect_shooters.py','.github/workflows/collect-shooters.yml']
permissions:
  contents: write
concurrency:
  group: shooter-discovery
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Resolve exact official identities, reviews and media
        run: python3 scripts/collect_shooters.py
      - name: Preserve incremental discovery checkpoint
        run: |
          git config user.name 'Games catalog bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/shooters-steam.json
          if ! git diff --cached --quiet; then
            git commit -m 'Verify boomer shooter candidates against official Steam metadata'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: shooter-discovery
          path: |
            data/shooters-steam.json
            data/shooters-seeds.json
            scripts/collect_shooters.py
