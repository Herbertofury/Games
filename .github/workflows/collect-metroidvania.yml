name: Refresh Metroidvania discoveries
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['data/metroidvania-seeds.txt','data/metroidvania-additions.json','scripts/collect_metroidvania.py']
permissions:
  contents: write
concurrency:
  group: metroidvania-research
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - run: python3 -m pip install -r requirements-dev.txt
      - name: Refresh facts while retaining all verified editions and separate curation layers
        run: python3 scripts/enrich_metroidvania.py
      - name: Preserve coherent source progress without replacing other genres
        if: always()
        run: |
          git config user.name 'Games catalog bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/metroidvania-*.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh Metroidvania facts, creator media and confirmed source coverage'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: metroidvania-discovery
          path: |
            data/metroidvania-*
            scripts/collect_metroidvania.py
            scripts/enrich_metroidvania.py
