name: Review survival sources
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/review-survival-sources.yml']
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: python3 -m pip install -r requirements-dev.txt
      - run: python3 scripts/review_survival_sources.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: survival-source-review
          path: |
            qa/survival-source-review/
            scripts/*survival*
            site/survival.js
            data/survival-*.json
