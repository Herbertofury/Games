name: Publish library
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['data/platformers-*','scripts/platformer*.py','scripts/collect_platformers.py','docs/PLATFORMERS-STUDY.md','site/**','scripts/build.py','scripts/catalog_model.py','scripts/wiki_builder.py','scripts/publish_wiki.py','scripts/media_qa.py','scripts/reconcile.py','scripts/collect_external_media.py','scripts/reconcile_shooter_sources.py','scripts/source_links.py','scripts/curate_rts.py','scripts/enrich_rts.py','scripts/collect_rts.py','data/rts-*.json','tests/**','docs/UPDATING.md','data/shooters-curation.json','data/shooters-external.json','data/media-completion.json','data/storefront-discovery.json','data/source-editions.json','scripts/metroidvania_model.py','scripts/metroidvania_wiki.py','scripts/metroidvania_qa.py','data/metroidvania-curation.json','data/metroidvania-media.json','data/metroidvania-review-decisions.json','data/metroidvania-storefronts.json','.github/workflows/publish.yml']
  workflow_run:
    workflows: ['Refresh Steam catalog','Add game recommendation','Install library source','Expand shooter library','Refresh shooter discoveries','Refresh RTS discoveries','Enrich RTS collection','Refresh Metroidvania discoveries','Enrich Metroidvania collection','Finalize Metroidvania source']
    types: [completed]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: library-publish
  cancel-in-progress: true
jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      pages-ready: ${{ steps.pages-probe.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build the canonical snapshot and run every source regression
        run: |
          set -o pipefail
          test -s data/catalog.json || { echo 'Official metadata refresh has not published its snapshot yet.'; exit 1; }
          python3 -m pip install -r requirements-dev.txt
          python3 scripts/reconcile.py
          python3 scripts/reconcile_shooter_sources.py
          python3 scripts/collect_external_media.py
          python3 scripts/build.py
          node --check site/app.js
          node --check site/platformers.js
          mkdir -p qa
          python3 -m unittest discover -s tests -p 'test_*.py' 2>&1 | tee qa/unit-tests.log
          python3 -c 'import json,re; s=open("qa/unit-tests.log").read();m=re.search(r"Ran (\d+) tests",s);json.dump({"passed":True,"tests":int(m[1]) if m else None},open("qa/unit-tests.json","w"),indent=2)'
      - name: Install browser QA dependencies
        run: |
          if command -v google-chrome >/dev/null; then
            echo "CHROMIUM_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
            google-chrome --version
          else
            python3 -m playwright install --with-deps chromium
          fi
      - name: Verify actual official trailer playback and image decoding
        timeout-minutes: 5
        run: |
          python3 scripts/media_qa.py
          mkdir -p qa/live-media
          cp qa/desktop.png qa/mobile.png qa/detail.png qa/live-media/
      - name: Real browser acceptance for every genre and completed platformer media
        run: |
          python3 tests/browser_qa.py
          python3 tests/multiplatform_qa.py
          python3 tests/source_completion_qa.py
          python3 tests/rts_qa.py
          python3 tests/platformers_qa.py
          python3 tests/platformer_completion_qa.py
          python3 scripts/metroidvania_qa.py
          cp qa/live-media/*.png qa/
      - name: Publish native wiki
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish_wiki.py
      - name: Check Pages publishing prerequisites
        id: pages-probe
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p qa
          if gh api repos/$GITHUB_REPOSITORY/pages > qa/pages-publication.json 2> qa/pages-error.txt; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            python3 -c 'import json;json.dump({"state":"unresolved-active","blocker":"Enable GitHub Pages once in Settings > Pages > Source: GitHub Actions."},open("qa/pages-publication.json","w"),indent=2)'
            echo 'Pages needs one-time repository enablement. Portable HTML and native wiki remain available.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Persist source-matched generated artifacts and QA
        run: |
          mkdir -p docs/qa
          cp qa/*.json docs/qa/
          cp qa/desktop.png qa/mobile.png qa/detail.png docs/qa/
          cp qa/shooters-*.png docs/qa/
          cp qa/rts-*.png docs/qa/
          cp qa/platformers-*.png docs/qa/
          cp qa/metroidvania-*.png docs/qa/
          TESTED_HTML_SHA=$(sha256sum dist/index.html | cut -d' ' -f1)
          python3 scripts/build.py
          test "$TESTED_HTML_SHA" = "$(sha256sum dist/index.html | cut -d' ' -f1)"
          git config user.name 'Games catalog bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist wiki data
          git add -f docs/qa
          if ! git diff --cached --quiet; then
            git commit -m 'Publish verified Metroidvania and complete platformer atlases with full-library runtime evidence'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Publish downloadable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="catalog-${GITHUB_RUN_NUMBER}"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title 'Games - Living Library' --notes-file docs/RELEASE.md --target main
          gh release upload "$TAG" 'release/Games - Explorer.html' 'release/Games - Library.zip' release/SHA256SUMS.txt --clobber
          gh release view "$TAG" --json url,assets > qa/release-publication.json
      - uses: actions/upload-pages-artifact@v3
        if: steps.pages-probe.outputs.ready == 'true'
        with:
          path: dist
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: games-release-and-verification
          path: |
            release/
            qa/
            data/external-media-report.json
            data/metroidvania-reconciliation.json
            data/metroidvania-review-decisions.json
            docs/METROIDVANIA.md
  deploy:
    needs: build
    if: needs.build.outputs.pages-ready == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the interactive collection
        id: deployment
        uses: actions/deploy-pages@v4
