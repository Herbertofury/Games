name: Collect survival sources
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/collect_survival_sources.py','data/survival-external-seeds.json','.github/workflows/collect-survival-sources.yml']
  workflow_run:
    workflows: ['Refresh survival discoveries']
    types: [completed]
permissions:
  contents: write
concurrency:
  group: survival-sources
  cancel-in-progress: false
jobs:
  sources:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - run: python3 -m pip install -r requirements-dev.txt
      - name: Verify creator projects, source media and exact alternate editions
        run: python3 scripts/collect_survival_sources.py
      - name: Preserve all successful provider checks and explicit unresolved records
        if: always()
        run: |
          git config user.name 'Games catalog bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/survival-*.json
          if ! git diff --cached --quiet; then
            git commit -m 'Checkpoint official survival creator media and alternate-store evidence'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: survival-sources
          path: |
            data/survival-*
            scripts/collect_survival_sources.py
