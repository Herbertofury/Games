name: Record lounge motion preview
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/lounge-motion-preview.yml']
permissions:
  contents: read
jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - run: python3 -m pip install -r requirements-dev.txt
      - name: Capture the exact built interface with real keyboard and pointer input
        shell: python
        run: |
          import hashlib,json,pathlib,subprocess,time
          from playwright.sync_api import sync_playwright
          root=pathlib.Path.cwd();out=root/'qa/motion-preview';out.mkdir(parents=True,exist_ok=True)
          assert "function fitWindow()" in (root/'site/arcade.js').read_text(),'Requires the corrected arcade viewport checkpoint'
          manifest=json.loads((root/'dist/manifest.json').read_text());html=root/'dist/index.html'
          assert hashlib.sha256(html.read_bytes()).hexdigest()==manifest['html']['sha256']
          report={'htmlSha256':manifest['html']['sha256'],'datasetHash':manifest['datasetHash'],'sourceRevision':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'method':'Real browser recording of the production portable HTML; real pointer and keyboard input; no synthetic game footage.','errors':[]}
          with sync_playwright() as pw:
            browser=pw.chromium.launch(executable_path='/usr/bin/google-chrome',headless=True,args=['--no-sandbox'])
            ctx=browser.new_context(viewport={'width':1280,'height':850},record_video_dir=str(out/'raw'),record_video_size={'width':1280,'height':850},reduced_motion='no-preference')
            start=time.monotonic();p=ctx.new_page();p.on('pageerror',lambda e:report['errors'].append(str(e)))
            p.goto(html.as_uri()+'#hub=Couch%20co-op%20%26%20party',wait_until='domcontentloaded');p.wait_for_function('window.Lounge&&window.DesktopArcade');p.wait_for_timeout(2200)
            content_start=time.monotonic()-start
            p.mouse.move(1020,740);p.wait_for_timeout(1800)
            p.locator('[data-lounge="spot-next"]').click();p.mouse.move(900,670);p.wait_for_timeout(2000)
            p.locator('[data-lounge="spot-prev"]').click();p.wait_for_timeout(1800)
            p.locator('[data-lounge="arcade"]').first.click();p.wait_for_timeout(1100);p.locator('[data-arcade="start"]').click();p.locator('#snackball').focus()
            for i in range(5):
              p.keyboard.down('d' if i%2==0 else 'a');p.keyboard.down('w' if i<2 else 's');p.keyboard.press('Space');p.wait_for_timeout(850);p.keyboard.up('d' if i%2==0 else 'a');p.keyboard.up('w' if i<2 else 's');p.keyboard.press('Space');p.wait_for_timeout(550)
            p.locator('[data-arcade="chaos"]').click();p.locator('#snackball').focus();p.keyboard.down('a');p.keyboard.press('Space');p.wait_for_timeout(1400);p.keyboard.up('a')
            report['gameplay']=p.evaluate('DesktopArcade.state');p.screenshot(path=str(out/'arcade-preview.png'))
            end=time.monotonic()-start;video=p.video;ctx.close();video.save_as(str(out/'Lounge-motion.webm'));browser.close()
          assert not report['errors'],report['errors']
          subprocess.run(['ffmpeg','-y','-loglevel','error','-ss',str(max(0,content_start-0.4)),'-i',str(out/'Lounge-motion.webm'),'-t',str(end-content_start+0.4),'-an','-c:v','libx264','-preset','fast','-crf','22','-pix_fmt','yuv420p','-movflags','+faststart',str(out/'Games-Lounge-preview.mp4')],check=True)
          report['previewBytes']=(out/'Games-Lounge-preview.mp4').stat().st_size;report['previewSha256']=hashlib.sha256((out/'Games-Lounge-preview.mp4').read_bytes()).hexdigest()
          (out/'motion-preview.json').write_text(json.dumps(report,indent=2)+'\n');print(json.dumps(report,indent=2))
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: games-lounge-motion-preview
          path: |
            qa/motion-preview/Games-Lounge-preview.mp4
            qa/motion-preview/arcade-preview.png
            qa/motion-preview/motion-preview.json
