name: Install library source
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/install.yml']
permissions:
  contents: write
concurrency:
  group: library-install
  cancel-in-progress: false
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Verify source archive and install canonical files
        shell: python
        run: |
          import base64, hashlib, json, lzma, pathlib
          root = pathlib.Path.cwd()
          payload = ''.join((root / f'.bootstrap/part-{i}.b64').read_text().strip() for i in range(5))
          raw = base64.b64decode(payload, validate=True)
          expected = '09564abf248d474567255edf0b3b01b0e10aa1eff16660bd46b1e5eecac7ba69'
          assert hashlib.sha256(raw).hexdigest() == expected, 'Source transfer integrity check failed'
          files = json.loads(lzma.decompress(raw))
          assert len(files) == 20
          for name, content in files.items():
              relative = pathlib.PurePosixPath(name)
              assert not relative.is_absolute() and '..' not in relative.parts
              assert relative.parts[0] in {'site', 'scripts', 'tests', 'docs', '.github', 'README.md', 'requirements-dev.txt', '.gitignore'}
              target = root / relative
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(content, encoding='utf-8')
              print(name, len(content.encode()), hashlib.sha256(content.encode()).hexdigest())
      - name: Check installed source
        run: |
          node --check site/app.js
          python3 -m py_compile scripts/*.py tests/*.py
          python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Commit recoverable source checkpoint
        run: |
          git config user.name 'Games catalog bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site scripts tests docs .github README.md requirements-dev.txt .gitignore
          if ! git diff --cached --quiet; then
            git commit -m 'Install complete Games library, wiki generator, updates, and browser tests'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
          echo "Installed source commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
