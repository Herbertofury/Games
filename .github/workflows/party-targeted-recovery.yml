name: Resolve couch party evidence
on:
  workflow_dispatch:
  push:
    paths: ['scripts/party_recover_sources.py','.github/workflows/party-targeted-recovery.yml']
permissions:
  contents: write
concurrency:
  group: party-evidence-recovery
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - run: python3 -m pip install -r requirements-dev.txt
      - run: python3 scripts/party_recover_sources.py
      - name: Persist only the recovered source slices
        if: always()
        run: |
          git config user.name 'Games catalog bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/party-recovered* data/party-supplemental-evidence.json data/party-missing-video-candidates.json
          if ! git diff --cached --quiet; then
            git commit -m 'Resolve outstanding exact couch identities and source capacity/media evidence'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: party-targeted-evidence
          path: |
            data/party-recovered*
            data/party-supplemental-evidence.json
            data/party-missing-video-candidates.json
            scripts/party_recover_sources.py
