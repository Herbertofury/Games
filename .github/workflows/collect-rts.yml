name: Refresh RTS discoveries
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['data/rts-seeds.json','scripts/collect_rts.py']
permissions:
  contents: write
concurrency:
  group: rts-collection
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Refresh exact RTS editions and preserve reconciliation
        run: |
          python3 -m pip install -r requirements-dev.txt
          python3 scripts/enrich_rts.py
      - name: Persist the discovery checkpoint
        run: |
          git config user.name 'Games catalog bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/rts-*.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh reconciled RTS identities, creator editions, stores, and official media'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: rts-discovery
          path: |
            data/rts-*.json
            scripts/collect_rts.py
