name: Refresh RTS discoveries
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['data/rts-seeds.json','scripts/collect_rts.py','.github/workflows/collect-rts.yml']
permissions:
  contents: write
concurrency:
  group: rts-collection
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Resolve every RTS candidate without changing earlier genres
        run: python3 scripts/collect_rts.py
      - name: Persist the discovery checkpoint
        run: |
          git config user.name 'Games catalog bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/rts-steam.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record exact RTS identities, current releases, ratings, and official media'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: rts-discovery
          path: |
            data/rts-seeds.json
            data/rts-steam.json
            scripts/collect_rts.py
