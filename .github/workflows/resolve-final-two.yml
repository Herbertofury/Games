name: Resolve final media references
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/resolve-final-two.yml']
permissions:
  contents: read
jobs:
  media:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install beautifulsoup4==4.13.4
      - name: Extract title-bound trailer metadata
        shell: python
        run: |
          import concurrent.futures,html,json,pathlib,re,urllib.request,urllib.parse
          from bs4 import BeautifulSoup
          ua='Mozilla/5.0 (compatible; GamesLibrary/1.2; +https://github.com/Herbertofury/Games)'
          def fetch(url):
            req=urllib.request.Request(url,headers={'User-Agent':ua})
            with urllib.request.urlopen(req,timeout=18) as r:return r.read(6000000).decode('utf-8',errors='replace')
          def parse(url):
            try:
              raw=fetch(url);s=BeautifulSoup(raw,'html.parser')
              yt=list(dict.fromkeys(re.findall(r'(?:youtube(?:-nocookie)?\.com/(?:embed/|watch\?v=)|youtu\.be/|i\.ytimg\.com/vi/|img\.youtube\.com/vi/)([A-Za-z0-9_-]{11})',html.unescape(raw.replace('\\/','/')))))
              relevant=[]
              def walk(x):
                if isinstance(x,dict):
                  if any(k.lower() in ['youtubeid','videoid','videos','trailers','video','trailer','externalid','external_id'] for k in x):relevant.append(x)
                  for v in x.values():walk(v)
                elif isinstance(x,list):
                  for v in x:walk(v)
              for t in s.select('script[type="application/json"],script[type="application/ld+json"],script#__NEXT_DATA__'):
                try:walk(json.loads(t.string or t.get_text()))
                except (ValueError,TypeError):pass
              links=[{'label':a.get_text(' ',strip=True),'url':urllib.parse.urljoin(url,a['href'])} for a in s.select('a[href]') if ('threads/' in a['href'] and 'tremor' in a['href'].lower()) or 'youtube' in a['href'] or 'youtu.be' in a['href']]
              return {'url':url,'title':s.title.get_text(' ',strip=True) if s.title else '', 'youtube':yt,'metadata':relevant,'links':links,'snippets':re.findall(r'.{0,120}(?:youtubeId|videoId|video_id|externalId|trailerId).{0,180}',raw,re.I)}
            except Exception as e:return {'url':url,'error':str(e)}
          urls=['https://www.senscritique.com/jeuvideo/Arcane_Dimensions/25702322','https://www.slipseer.com/index.php?resources/tremor.614/','https://www.vgcal.com/game/arcane-dimensions']
          with concurrent.futures.ThreadPoolExecutor(max_workers=3) as pool:report=list(pool.map(parse,urls))
          threads=list(dict.fromkeys(x['url'] for r in report for x in r.get('links',[]) if 'threads/' in x['url'] and 'tremor' in x['url'].lower()))
          with concurrent.futures.ThreadPoolExecutor(max_workers=3) as pool:report+=list(pool.map(parse,threads))
          p=pathlib.Path('qa');p.mkdir(exist_ok=True);(p/'final-media-references.json').write_text(json.dumps(report,indent=2)+'\n');print(json.dumps(report,indent=2))
      - uses: actions/upload-artifact@v4
        with:
          name: final-media-references
          path: qa/final-media-references.json
