name: Refresh survival discoveries
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['data/survival-seeds.txt','data/survival-additions.json','scripts/collect_survival.py']
permissions:
  contents: write
concurrency:
  group: survival-research
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - run: python3 -m pip install -r requirements-dev.txt
      - name: Refresh exact identities without discarding reconciled editions or newer candidates
        run: python3 scripts/enrich_survival.py
      - name: Preserve successful facts and explicit unresolved identities
        if: always()
        run: |
          git config user.name 'Games catalog bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/survival-*.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh Survival and Minecraft-like facts while preserving exact edition lineage'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: survival-discovery
          path: |
            data/survival-*
            scripts/collect_survival.py
            scripts/enrich_survival.py
