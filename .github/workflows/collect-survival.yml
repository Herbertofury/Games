name: Refresh survival discoveries
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['data/survival-seeds.txt','data/survival-additions.json','scripts/collect_survival.py','.github/workflows/collect-survival.yml']
permissions:
  contents: write
concurrency:
  group: survival-research
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - run: python3 -m pip install -r requirements-dev.txt
      - name: Verify exact games, current releases, review counts, images and video sources
        run: python3 scripts/collect_survival.py
      - name: Preserve all successful discoveries and unresolved identities
        if: always()
        run: |
          git config user.name 'Games catalog bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/survival-*.json
          if ! git diff --cached --quiet; then
            git commit -m 'Checkpoint Survival and Minecraft-like identities with source media and current evidence'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: survival-discovery
          path: |
            data/survival-*
            scripts/collect_survival.py
