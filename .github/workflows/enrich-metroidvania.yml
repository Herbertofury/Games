name: Enrich Metroidvania collection
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/enrich_metroidvania.py','data/metroidvania-expansion.json','.github/workflows/enrich-metroidvania.yml']
permissions:
  contents: write
concurrency:
  group: metroidvania-research
  cancel-in-progress: false
jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - run: python3 -m pip install -r requirements-dev.txt
      - name: Resolve exact games, creator media, and additional storefronts
        run: python3 scripts/enrich_metroidvania.py
      - name: Preserve coherent research before browser publication
        if: always()
        run: |
          git config user.name 'Games catalog bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/metroidvania-*.json
          if ! git diff --cached --quiet; then
            git commit -m 'Preserve Metroidvania facts, creator media, exact stores, and unresolved coverage'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: metroidvania-enrichment
          path: |
            data/metroidvania-*
            scripts/collect_metroidvania.py
            scripts/enrich_metroidvania.py
