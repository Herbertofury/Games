name: Review survival release chronology
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/review_survival_chronology.py','.github/workflows/review-survival-chronology.yml']
permissions:
  contents: write
concurrency:
  group: survival-chronology-review
  cancel-in-progress: false
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - run: python3 -m pip install -r requirements-dev.txt
      - name: Review only recent-dated entries, keeping unresolved source reads explicit
        run: python3 scripts/review_survival_chronology.py
      - name: Preserve the source-evidence delta without changing the running app build
        run: |
          git config user.name 'Games catalog bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/survival-chronology.json data/survival-chronology-report.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record official first Early Access dates separately from later survival release milestones'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: survival-release-chronology
          path: data/survival-chronology*.json
